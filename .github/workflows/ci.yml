name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    name: Format / Test / Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wakeplane
          POSTGRES_PASSWORD: wakeplane
          POSTGRES_DB: wakeplane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wakeplane -d wakeplane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Verify generated docs
        run: go run ./tools/docsgen --check

      - name: Run tests
        run: go test ./... -count=1 -timeout 120s

      - name: Run Postgres integration tests
        env:
          WAKEPLANE_POSTGRES_TEST_URL: postgres://wakeplane:wakeplane@127.0.0.1:5432/wakeplane?sslmode=disable
        run: scripts/test-postgres-store.sh

      - name: Build binaries
        run: |
          go build -o /dev/null ./cmd/wakeplane
          go build -o /dev/null ./cmd/wakeplaned
