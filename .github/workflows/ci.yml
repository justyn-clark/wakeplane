name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    name: Format / Test / Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wakeplane
          POSTGRES_PASSWORD: wakeplane
          POSTGRES_DB: wakeplane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wakeplane -d wakeplane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install formatting tools
        run: pnpm install --frozen-lockfile
      - name: Lint, format, and console tests
        run: pnpm run check
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.36.1"
      - name: Validate rendered deployment safety and Kubernetes schemas
        run: |
          go run ./tools/deploycheck
          for provider in aws google-cloud; do
            kubectl kustomize "infra/kubernetes/$provider" | go run github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0 -strict -summary -kubernetes-version 1.36.0
          done
      - name: Vet Go code
        run: go vet ./...

      - name: Verify formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Verify generated docs
        run: go run ./tools/docsgen --check

      - name: Run tests
        run: go test -race ./... -count=1 -timeout 120s

      - name: Run Postgres integration tests
        env:
          WAKEPLANE_POSTGRES_TEST_URL: postgres://wakeplane:wakeplane@127.0.0.1:5432/wakeplane?sslmode=disable
        run: scripts/test-postgres-store.sh

      - name: Build binaries
        run: |
          go build -o /dev/null ./cmd/wakeplane
          go build -o /dev/null ./cmd/wakeplaned

      - name: Verify container packaging and persistent restart
        run: bash scripts/container-smoke.sh

      - name: Validate Cloudflare Worker and container configuration without deployment
        run: pnpm run check:cloudflare
