summary: Wakeplane is on the public beta baseline with source docs synced into wakeplane.dev. The next product track is to reduce install friction, then add retention bounds, single-operator auth/audit, operator ergonomics, Postgres, and soak/backup verification before any stable label.
resume:
  next_steps:
    - Finish hosted curl installer verification and publish it at https://wakeplane.dev/install.sh.
    - Implement retention and size bounds for receipts, runs, and dead letters.
    - Add single-operator authn/authz and HTTP-layer audit logging before broader deployment exposure.
    - Improve schedule export/import/update and fleet inspection ergonomics.
    - Build and validate the Postgres dialect at the existing store seam.
    - Add soak, restart-recovery, and backup/restore verification against real operator workloads.
    - Decide whether to expose a stable non-internal public Go embedding package or keep embedding source-level only in v0.2.x.
